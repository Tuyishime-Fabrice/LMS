name: Verify
on:
  push:
    branches: [main, 'claude/**', 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  checkout-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
